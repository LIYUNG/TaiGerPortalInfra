AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Resources:
    cronJobFunction:
        Type: AWS::Serverless::Function
        Properties:
            Handler: index.handler
            Runtime: nodejs20.x
            CodeUri: ./
            MemorySize: 1024
            Timeout: 15
            Events:
                ApiEvent:
                    Type: Api
                    Properties:
                        Path: /cron-jobs
                        Method: post
        Metadata:
            # The handler is TypeScript, so let `sam build` run esbuild over it
            # the same way the CDK NodejsFunction does.
            BuildMethod: esbuild
            BuildProperties:
                Format: cjs
                Minify: false
                Sourcemap: true
                Target: es2020
                EntryPoints:
                    - lambda/cron-jobs/index.ts
